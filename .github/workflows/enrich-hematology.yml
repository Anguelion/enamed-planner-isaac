name: Enriquecer questões de Hematologia

on:
  workflow_dispatch:
    inputs:
      limit:
        description: Quantidade de questões neste lote
        required: false
        default: '6'
  schedule:
    - cron: '17 6,18 * * *'

permissions:
  contents: write

concurrency:
  group: enrich-hematology
  cancel-in-progress: false

jobs:
  enrich:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Processar próximo lote
        env:
          BATCH_LIMIT: ${{ inputs.limit || '6' }}
        run: |
          node scripts/enrich-anki-questions.js \
            --area Hematologia \
            --limit "$BATCH_LIMIT" \
            --delay 5000 \
            --write \
            --state reports/question-enrichment/hematology-state.json \
            --review reports/question-enrichment/hematology-review.json \
            --report reports/question-enrichment/hematology-latest.json
          npm run questions:index

      - name: Publicar resultados seguros
        run: |
          if git diff --quiet && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "Nenhuma mudança neste lote."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add question_bank reports/question-enrichment
          git commit -m "Atualiza lote automático de Hematologia"
          git pull --rebase origin main
          git push origin HEAD:main
